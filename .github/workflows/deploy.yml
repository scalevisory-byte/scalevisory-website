# Builds the static export and publishes it to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer push finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same gate used locally, so a broken build never reaches the domain.
      - run: npm run typecheck

      - run: npm run build
        env:
          # Canonicals and the sitemap always name the real domain, so the
          # github.io preview never competes with it in search.
          NEXT_PUBLIC_SITE_URL: https://scalevisory.in
          # The site currently lives at github.io/scalevisory-website/, so every
          # asset needs that prefix. WHEN scalevisory.in IS POINTED HERE: delete
          # this line and restore the CNAME step below, in the same commit.
          BASE_PATH: /scalevisory-website

      # Restore once DNS points at GitHub Pages:
      # - run: echo 'scalevisory.in' > out/CNAME

      # Without this, GitHub Pages' Jekyll step strips _next/, which holds all
      # the CSS and JS — the site would render unstyled.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
