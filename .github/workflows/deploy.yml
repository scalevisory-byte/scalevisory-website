# Builds the static export and publishes it to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The compliance calendar is computed from the build date, so the site has to
  # rebuild for it to roll over. Daily, early morning IST. Nothing else on the
  # site depends on the clock, so a missed run costs at most a stale calendar.
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer push finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The same gate used locally, so a broken build never reaches the domain.
      - run: npm run typecheck

      # Where the site is served from decides whether every asset URL needs a
      # subpath prefix, and getting that wrong ships a site with no CSS. So it
      # is derived from one thing rather than hand-edited:
      #
      #   public/CNAME present  → a custom domain, served at the root, no prefix
      #   public/CNAME absent   → the github.io project site, needs the prefix
      #
      # Next copies public/ into out/, so the same file is what tells GitHub
      # Pages which domain to answer on. Cutting over is therefore one commit
      # that adds the file, and rolling back is one that deletes it.
      - name: Work out the base path
        id: site
        run: |
          if [ -f public/CNAME ]; then
            echo "base_path=" >> "$GITHUB_OUTPUT"
            echo "Custom domain $(cat public/CNAME) — building for the root."
          else
            echo "base_path=/scalevisory-website" >> "$GITHUB_OUTPUT"
            echo "No CNAME — building for the github.io project subpath."
          fi

      - run: npm run build
        env:
          # Canonicals and the sitemap always name the real domain, so the
          # github.io preview never competes with it in search.
          NEXT_PUBLIC_SITE_URL: https://scalevisory.in
          BASE_PATH: ${{ steps.site.outputs.base_path }}

      # Without this, GitHub Pages' Jekyll step strips _next/, which holds all
      # the CSS and JS — the site would render unstyled.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
